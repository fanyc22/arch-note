<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      onload="ArchNotePrefs.init();"
      class="arch-note-preferences">
  <groupbox>
    <caption label="Arch Note Zotero"/>
    <checkbox id="arch-note-enabled" label="Enable plugin"/>
    <checkbox id="arch-note-auto-run" label="Generate a guide automatically when new papers are added"/>
    <checkbox id="arch-note-force-index" label="Ask Zotero to index PDF text before generation"/>

    <html:div style="display: grid; grid-template-columns: 160px minmax(260px, 1fr); gap: 8px 12px; margin-top: 14px; align-items: center;">
      <html:label for="arch-note-provider">API provider</html:label>
      <html:select id="arch-note-provider" onchange="ArchNotePrefs.changeProvider();">
        <html:option value="deepseek">DeepSeek</html:option>
        <html:option value="poixe">Poixe</html:option>
      </html:select>

      <html:label for="arch-note-api-key">API key</html:label>
      <html:input id="arch-note-api-key" type="password" autocomplete="off"/>

      <html:label for="arch-note-base-url">Base URL</html:label>
      <html:input id="arch-note-base-url" type="text"/>

      <html:label for="arch-note-model">Model</html:label>
      <html:input id="arch-note-model" type="text"/>

      <html:label for="arch-note-language">Language</html:label>
      <html:select id="arch-note-language">
        <html:option value="zh-CN">Chinese</html:option>
        <html:option value="en">English</html:option>
      </html:select>

      <html:label for="arch-note-max-chars">Max paper chars</html:label>
      <html:input id="arch-note-max-chars" type="number" min="2000" step="1000"/>

      <html:label for="arch-note-max-tokens">Max output tokens</html:label>
      <html:input id="arch-note-max-tokens" type="number" min="512" step="256"/>

      <html:label for="arch-note-delay">Auto-run delay seconds</html:label>
      <html:input id="arch-note-delay" type="number" min="0" step="1"/>
    </html:div>

    <hbox style="margin-top: 14px;">
      <button label="Save" oncommand="ArchNotePrefs.save();"/>
    </hbox>

    <html:p style="max-width: 720px; color: var(--fill-secondary, #666);">
      Each provider's API key is stored separately in Zotero preferences on this machine.
    </html:p>
  </groupbox>
</vbox>
